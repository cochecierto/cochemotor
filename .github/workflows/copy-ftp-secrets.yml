name: Copy FTP Secrets to Desguace
on:
  workflow_dispatch:
    inputs:
      gh_token:
        description: 'GitHub Token with repo scope'
        required: true

jobs:
  copy-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Set secrets on desguace repo
        env:
          GH_TOKEN: ${{ inputs.gh_token }}
          FTP_H: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_U: ${{ secrets.HOSTINGER_FTP_USER }}
          FTP_P: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          echo -n "$FTP_H" | gh secret set HOSTINGER_FTP_HOST -R cochecierto/desguace
          echo -n "$FTP_U" | gh secret set HOSTINGER_FTP_USER -R cochecierto/desguace
          echo -n "$FTP_P" | gh secret set HOSTINGER_FTP_PASSWORD -R cochecierto/desguace
          echo -n "public_html/desguace/" | gh secret set HOSTINGER_FTP_DIR -R cochecierto/desguace
          echo "✓ Secrets successfully copied to cochecierto/desguace!"
