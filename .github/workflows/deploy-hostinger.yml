name: Despliegue Continuo a Hostinger (cochemotor.es)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Desplegar a Hostinger public_html
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Desplegar vía FTP a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.HOSTINGER_REMOTE_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/specs/**
            **/docs/**
            **/.codex/**
            **/.agents/**
            **/tests/**
            **/database/**
            **/wordpress/**
            **/references/**
            **/local-broker/**
            **/scripts/**
            **/app/**
            **/*.zip
            **/*.db
            **/*.sqlite
            **/*.sqlite3
            **/*.py
            **/README.md
            .gitignore
            AGENTS.md
            api/config.template.php
            iniciar_cochemotor.bat
            deploy_hostinger.py
