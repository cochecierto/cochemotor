name: CocheMotor · Validación del flujo profesional

on:
  push:
    branches: [main]
    paths:
      - "demo-profesional.html"
      - "demo-profesional.css"
      - "demo-profesional.js"
      - "profesionales.html"
      - "profesionales.css"
      - "api/index.php"
      - "docs/CURRENT-STATE.md"
      - "tests/**"
      - ".github/workflows/deploy-hostinger.yml"
  pull_request:
    branches: [main]
    paths:
      - "demo-profesional.html"
      - "demo-profesional.css"
      - "demo-profesional.js"
      - "profesionales.html"
      - "profesionales.css"
      - "api/index.php"
      - "docs/CURRENT-STATE.md"
      - "tests/**"
      - ".github/workflows/deploy-hostinger.yml"

permissions:
  contents: read

concurrency:
  group: cochemotor-hostinger-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validar recorrido profesional
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v5

      - name: Ejecutar pruebas del proyecto
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Comprobar sintaxis JavaScript
        run: node --check demo-profesional.js

      - name: Comprobar sintaxis PHP de la API
        run: php -l api/index.php
