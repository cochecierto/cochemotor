name: CocheMotor · Despliegue SEO SFTP

on:
  push:
    branches: [main]
    paths:
      - ".htaccess"
      - "robots.txt"
      - "sitemap.xml"
      - "sitemap-public.php"
      - "seo-public.php"
      - "site-config.js"
      - "hub.js"
      - "acceso.html"
      - "seo-legacy-redirect.php"
      - "index.html"
      - "app.js"
      - "demo-profesional.html"
      - "demo-profesional.css"
      - "demo-profesional.js"
      - "marketplace.html"
      - "demanda.html"
      - "profesionales.html"
      - "profesionales.css"
      - "aviso-legal.html"
      - "privacidad.html"
      - "terminos.html"
      - "ficha.html"
      - "dealer.html"
      - "perfil.html"
      - "publicar.html"
      - "hub.html"
      - "vehiculo-nuevo.html"
      - "asesor.html"
      - "asesor-leads.html"
      - "styles.css"
      - "cookie-consent.js"
      - "cookie-consent.css"
      - "assets/js/home_catalog.js"
      - "assets/js/public-lead-form.js"
      - "assets/data/vehicles_catalog.js"
      - "assets/js/inventory_selectors.js"
      - "assets/brand/category-02-compacto-proxima-entrada-cochemotor-branded-v2.png"
      - "database/migrations/007_lead_and_registration_notice_mysql.sql"
      - "api/index.php"
      - "scripts/hostinger-release-transaction.sh"
      - "guias/comprar-coche-usado.html"
      - "tests/**"
      - ".github/workflows/deploy-seo-hostinger.yml"
  pull_request:
    branches: [main]
    paths:
      - ".htaccess"
      - "robots.txt"
      - "sitemap.xml"
      - "sitemap-public.php"
      - "seo-public.php"
      - "site-config.js"
      - "hub.js"
      - "acceso.html"
      - "seo-legacy-redirect.php"
      - "index.html"
      - "app.js"
      - "demo-profesional.html"
      - "demo-profesional.css"
      - "demo-profesional.js"
      - "marketplace.html"
      - "demanda.html"
      - "profesionales.html"
      - "profesionales.css"
      - "aviso-legal.html"
      - "privacidad.html"
      - "terminos.html"
      - "ficha.html"
      - "dealer.html"
      - "perfil.html"
      - "publicar.html"
      - "hub.html"
      - "vehiculo-nuevo.html"
      - "asesor.html"
      - "asesor-leads.html"
      - "styles.css"
      - "cookie-consent.js"
      - "cookie-consent.css"
      - "assets/js/home_catalog.js"
      - "assets/js/public-lead-form.js"
      - "assets/data/vehicles_catalog.js"
      - "assets/js/inventory_selectors.js"
      - "assets/brand/category-02-compacto-proxima-entrada-cochemotor-branded-v2.png"
      - "database/migrations/007_lead_and_registration_notice_mysql.sql"
      - "api/index.php"
      - "scripts/hostinger-release-transaction.sh"
      - "guias/comprar-coche-usado.html"
      - "tests/**"
      - ".github/workflows/deploy-seo-hostinger.yml"
  workflow_dispatch:
    inputs:
      seo_backup_ready:
        description: "He verificado una copia reciente de la base de CocheMotor anterior a este despliegue."
        required: true
        type: boolean
        default: false
      seo_no_ddl:
        description: "Confirmo que este release no aplica migraciones ni cambios de esquema a la base de datos."
        required: true
        type: boolean
        default: false
      seo_beta_writes_disabled:
        description: "Confirmo que el release bloquea por 403 el acceso y toda escritura/captura pública: inventario, Coche Ideal, informes y consultas."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cochemotor-hostinger-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validar rutas SEO antes de publicar
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v5

      - name: Ejecutar pruebas del proyecto
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Comprobar sintaxis JavaScript
        run: |
          node --check app.js
          node --check demo-profesional.js
          node --check hub.js
          node --check site-config.js
          node --check assets/js/home_catalog.js
          node --check assets/js/public-lead-form.js

      - name: Comprobar sintaxis PHP
        run: |
          php -l api/index.php
          php -l seo-public.php
          php -l sitemap-public.php
          php -l seo-legacy-redirect.php

      - name: Comprobar sintaxis del promotor transaccional
        run: bash -n scripts/hostinger-release-transaction.sh

      - name: Validar sitemap estático
        run: python3 -c "import xml.etree.ElementTree as ET; root=ET.parse('sitemap.xml').getroot(); assert root.tag.endswith('urlset') and len(root)>0"

  deploy:
    name: Publicar páginas SEO por SFTP
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar backup y release beta sin DDL
        env:
          SEO_BACKUP_READY: ${{ inputs.seo_backup_ready }}
          SEO_NO_DDL: ${{ inputs.seo_no_ddl }}
          SEO_BETA_WRITES_DISABLED: ${{ inputs.seo_beta_writes_disabled }}
        run: |
          if [[ "$SEO_BACKUP_READY" != "true" ]]; then
            echo "::error::Despliegue detenido. Crea y verifica un backup reciente de la base antes de publicar."
            exit 1
          fi
          if [[ "$SEO_NO_DDL" != "true" ]]; then
            echo "::error::Despliegue detenido. Este release debe confirmar que no aplica migraciones ni DDL."
            exit 1
          fi
          if [[ "$SEO_BETA_WRITES_DISABLED" != "true" ]]; then
            echo "::error::Despliegue detenido. El release debe mantener bloqueadas las escrituras de beta."
            exit 1
          fi


      - name: Obtener código
        uses: actions/checkout@v5

      - name: Validar secretos y host key SFTP
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          SSH_WEB_ROOT: ${{ secrets.HOSTINGER_SSH_WEB_ROOT }}
        run: |
          missing=()
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS SSH_WEB_ROOT; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::Faltan secretos de despliegue SFTP: ${missing[*]}."
            exit 1
          fi
          if [[ ! "$SSH_WEB_ROOT" =~ ^[A-Za-z0-9_./-]+$ || "$SSH_WEB_ROOT" == /* || "$SSH_WEB_ROOT" == *..* ]]; then
            echo "::error::HOSTINGER_SSH_WEB_ROOT debe ser una ruta relativa segura."
            exit 1
          fi
          mkdir -m 700 -p "$RUNNER_TEMP/cochemotor-seo-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/cochemotor-seo-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/cochemotor-seo-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/cochemotor-seo-ssh/id_ed25519" "$RUNNER_TEMP/cochemotor-seo-ssh/known_hosts"
          ssh-keygen -F "[$SSH_HOST]:65002" -f "$RUNNER_TEMP/cochemotor-seo-ssh/known_hosts" >/dev/null || {
            echo "::error::La clave de host fijada no corresponde al servidor SFTP y puerto configurados."
            exit 1
          }

      - name: Subir el paquete íntegro a staging privado
        id: stage
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_WEB_ROOT: ${{ secrets.HOSTINGER_SSH_WEB_ROOT }}
        run: |
          set -euo pipefail
          release=$GITHUB_SHA
          stage=".cochemotor-stage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${release:0:12}"
          backup=".cochemotor-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${release:0:12}"
          assets=(.htaccess robots.txt sitemap.xml sitemap-public.php seo-public.php seo-legacy-redirect.php index.html app.js demo-profesional.html demo-profesional.css demo-profesional.js styles.css cookie-consent.js cookie-consent.css site-config.js hub.js acceso.html marketplace.html demanda.html profesionales.html profesionales.css aviso-legal.html privacidad.html terminos.html ficha.html dealer.html perfil.html publicar.html hub.html vehiculo-nuevo.html asesor.html asesor-leads.html api/index.php assets/js/home_catalog.js assets/js/public-lead-form.js assets/data/vehicles_catalog.js assets/js/inventory_selectors.js assets/brand/category-02-compacto-proxima-entrada-cochemotor-branded-v2.png guias/comprar-coche-usado.html assets/images/inspeccion-taller-cochemotor.png)
          sha256sum "${assets[@]}" > "$RUNNER_TEMP/cochemotor-release.sha256"
          script_hash="$(sha256sum scripts/hostinger-release-transaction.sh | cut -d' ' -f1)"
          printf '%s  promote.sh\n' "$script_hash" >> "$RUNNER_TEMP/cochemotor-release.sha256"
          sftp -b - -P 65002 \
            -i "$RUNNER_TEMP/cochemotor-seo-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/cochemotor-seo-ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" <<SFTP
          cd $SSH_WEB_ROOT
          cd ..
          mkdir $stage
          mkdir $stage/api
          mkdir $stage/guias
          mkdir $stage/assets
          mkdir $stage/assets/images
          mkdir $stage/assets/js
          mkdir $stage/assets/data
          mkdir $stage/assets/brand
          put .htaccess $stage/.htaccess
          put robots.txt $stage/robots.txt
          put sitemap.xml $stage/sitemap.xml
          put sitemap-public.php $stage/sitemap-public.php
          put seo-public.php $stage/seo-public.php
          put seo-legacy-redirect.php $stage/seo-legacy-redirect.php
          put index.html $stage/index.html
          put app.js $stage/app.js
          put demo-profesional.html $stage/demo-profesional.html
          put demo-profesional.css $stage/demo-profesional.css
          put demo-profesional.js $stage/demo-profesional.js
          put styles.css $stage/styles.css
          put cookie-consent.js $stage/cookie-consent.js
          put cookie-consent.css $stage/cookie-consent.css
          put site-config.js $stage/site-config.js
          put hub.js $stage/hub.js
          put acceso.html $stage/acceso.html
          put marketplace.html $stage/marketplace.html
          put demanda.html $stage/demanda.html
          put profesionales.html $stage/profesionales.html
          put profesionales.css $stage/profesionales.css
          put aviso-legal.html $stage/aviso-legal.html
          put privacidad.html $stage/privacidad.html
          put terminos.html $stage/terminos.html
          put ficha.html $stage/ficha.html
          put dealer.html $stage/dealer.html
          put perfil.html $stage/perfil.html
          put publicar.html $stage/publicar.html
          put hub.html $stage/hub.html
          put vehiculo-nuevo.html $stage/vehiculo-nuevo.html
          put asesor.html $stage/asesor.html
          put asesor-leads.html $stage/asesor-leads.html
          put api/index.php $stage/api/index.php
          put assets/js/home_catalog.js $stage/assets/js/home_catalog.js
          put assets/js/public-lead-form.js $stage/assets/js/public-lead-form.js
          put assets/data/vehicles_catalog.js $stage/assets/data/vehicles_catalog.js
          put assets/js/inventory_selectors.js $stage/assets/js/inventory_selectors.js
          put assets/brand/category-02-compacto-proxima-entrada-cochemotor-branded-v2.png $stage/assets/brand/category-02-compacto-proxima-entrada-cochemotor-branded-v2.png
          put guias/comprar-coche-usado.html $stage/guias/comprar-coche-usado.html
          put assets/images/inspeccion-taller-cochemotor.png $stage/assets/images/inspeccion-taller-cochemotor.png
          put scripts/hostinger-release-transaction.sh $stage/promote.sh
          put $RUNNER_TEMP/cochemotor-release.sha256 $stage/release.sha256
          SFTP
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "backup=$backup" >> "$GITHUB_OUTPUT"

      - name: Promover release y verificar producción con rollback automático
        id: release
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_WEB_ROOT: ${{ secrets.HOSTINGER_SSH_WEB_ROOT }}
          STAGE: ${{ steps.stage.outputs.stage }}
          BACKUP: ${{ steps.stage.outputs.backup }}
        run: |
          set -euo pipefail
          release=$GITHUB_SHA
          web_root_name=${SSH_WEB_ROOT##*/}
          promotion_attempted=0
          verified=0
          remote() {
            ssh -p 65002 \
              -i "$RUNNER_TEMP/cochemotor-seo-ssh/id_ed25519" \
              -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$RUNNER_TEMP/cochemotor-seo-ssh/known_hosts" \
              "$SSH_USER@$SSH_HOST" "$1"
          }
          rollback_on_exit() {
            status=$?
            trap - EXIT
            if (( promotion_attempted && ! verified )); then
              command="cd '$SSH_WEB_ROOT/..' && bash '$STAGE/promote.sh' rollback '$web_root_name' '$STAGE' '$BACKUP' '$release'"
              if remote "$command"; then echo "Release reverted after failed production verification."; else echo "::error::Automatic rollback failed; preserve $BACKUP for manual recovery."; fi
            fi
            exit "$status"
          }
          trap rollback_on_exit EXIT
          # Arm client-side recovery before SSH: a disconnect may happen after
          # the remote script has moved only part of the release.
          promotion_attempted=1
          command="cd '$SSH_WEB_ROOT/..' && bash '$STAGE/promote.sh' promote '$web_root_name' '$STAGE' '$BACKUP' '$release'"
          remote "$command"

          curl --fail --silent --show-error --retry 4 --retry-delay 2 https://cochemotor.es/robots.txt -o "$RUNNER_TEMP/cochemotor-robots.txt"
          grep -F "Sitemap: https://cochemotor.es/sitemap.xml" "$RUNNER_TEMP/cochemotor-robots.txt"
          grep -F "Disallow: /api/" "$RUNNER_TEMP/cochemotor-robots.txt"
          for route in acceso.html hub.html asesor.html asesor-leads.html; do
            if grep -F "Disallow: /$route" "$RUNNER_TEMP/cochemotor-robots.txt"; then echo "::error::/$route no debe bloquearse en robots.txt; Google necesita leer noindex."; exit 1; fi
            page="$RUNNER_TEMP/$route"
            curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "https://cochemotor.es/$route" -o "$page"
            grep -Eiq '<meta name="robots" content="noindex,follow">' "$page"
          done
          curl --fail --silent --show-error --retry 4 --retry-delay 2 https://cochemotor.es/sitemap.xml -o "$RUNNER_TEMP/cochemotor-sitemap.xml"
          python3 -c "import xml.etree.ElementTree as ET; root=ET.parse(r'$RUNNER_TEMP/cochemotor-sitemap.xml').getroot(); urls=[e.text for e in root.iter() if e.tag.endswith('loc')]; excluded=('/publicar.html','/acceso.html','/hub.html','/asesor.html','/asesor-leads.html'); assert any(u.endswith('/guias/comprar-coche-usado.html') for u in urls); assert not any(u.endswith(excluded) for u in urls)"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 https://cochemotor.es/ -o "$RUNNER_TEMP/cochemotor-home.html"
          grep -F '<link rel="canonical" href="https://cochemotor.es/">' "$RUNNER_TEMP/cochemotor-home.html"
          grep -F 'application/ld+json' "$RUNNER_TEMP/cochemotor-home.html"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 https://cochemotor.es/site-config.js -o "$RUNNER_TEMP/cochemotor-site-config.js"
          grep -F 'Consulta el estado del catálogo real.' "$RUNNER_TEMP/cochemotor-site-config.js"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 https://cochemotor.es/acceso.html -o "$RUNNER_TEMP/cochemotor-access.html"
          grep -F 'No introduzcas datos personales' "$RUNNER_TEMP/cochemotor-access.html"
          curl --fail --silent --show-error --retry 4 --retry-delay 2 https://cochemotor.es/api/public/vehicles -o "$RUNNER_TEMP/cochemotor-public-vehicles.json"
          python3 -c "import json; data=json.load(open(r'$RUNNER_TEMP/cochemotor-public-vehicles.json', encoding='utf-8')); vehicles=data.get('vehicles'); assert isinstance(vehicles,list); assert all(v.get('status')=='disponible' and not v.get('isDemo') for v in vehicles)"
          for endpoint in \
            "https://cochemotor.es/api/auth/oauth/google" \
            "https://cochemotor.es/api/auth/callback/google" \
            "https://cochemotor.es/api/auth/verify?token=synthetic-only"; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$endpoint")"
            if [[ "$status" != "403" ]]; then echo "::error::Las rutas de acceso deben responder 403 ($endpoint: $status)."; exit 1; fi
          done
          for endpoint in \
            "https://cochemotor.es/api/auth" \
            "https://cochemotor.es/api/vehicles" \
            "https://cochemotor.es/api/coche-ideal" \
            "https://cochemotor.es/api/leads" \
            "https://cochemotor.es/api/report" \
            "https://cochemotor.es/api/moderation/vehicles"; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{}' "$endpoint")"
            if [[ "$status" != "403" ]]; then echo "::error::La API informativa debe rechazar escrituras con 403 ($endpoint: $status)."; exit 1; fi
          done
          private_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://cochemotor.es/api/vehicles)"
          if [[ "$private_status" != "403" ]]; then echo "::error::Los endpoints de cuenta deben seguir cerrados ($private_status)."; exit 1; fi
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 https://cochemotor.es/guias/comprar-coche-usado.html -o "$RUNNER_TEMP/cochemotor-guide.html"
          grep -F "Cómo revisar un coche de segunda mano antes de comprar" "$RUNNER_TEMP/cochemotor-guide.html"

          remote_dir="$RUNNER_TEMP/hostinger-assets"
          assets=(index.html app.js acceso.html site-config.js hub.js styles.css demo-profesional.html demo-profesional.css demo-profesional.js api/index.php assets/js/home_catalog.js assets/js/public-lead-form.js assets/js/inventory_selectors.js assets/data/vehicles_catalog.js assets/brand/category-02-compacto-proxima-entrada-cochemotor-branded-v2.png)
          for asset in "${assets[@]}"; do
            mkdir -p "$remote_dir/$(dirname "$asset")"
            sftp -b - -P 65002 \
              -i "$RUNNER_TEMP/cochemotor-seo-ssh/id_ed25519" \
              -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$RUNNER_TEMP/cochemotor-seo-ssh/known_hosts" \
              "$SSH_USER@$SSH_HOST" <<SFTP
          cd $SSH_WEB_ROOT
          get $asset $remote_dir/$asset
          SFTP
            local_hash="$(sha256sum "$asset" | cut -d' ' -f1)"
            remote_hash="$(sha256sum "$remote_dir/$asset" | cut -d' ' -f1)"
            if [[ "$local_hash" != "$remote_hash" ]]; then echo "::error::El archivo en Hostinger no coincide con el commit para $asset."; exit 1; fi
          done
          verified=1
          trap - EXIT
          echo "Release $release verificado en Hostinger; backup de rollback: $BACKUP"
