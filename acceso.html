<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex,follow">
  <title>Accede a CocheMotor</title>
  <link rel="icon" href="assets/brand/favicons/favicon.ico?v=11.0" sizes="any"><link rel="stylesheet" href="styles.css?v=20260914.1">
</head>
<body class="auth-page">
  <main class="auth-card" aria-labelledby="auth-title">
    <div class="auth-head"><a href="/" class="auth-brand" aria-label="Volver a CocheMotor"><img src="assets/brand/logos/cochemotor-horizontal-light.png" alt="CocheMotor" class="auth-logo"></a><a href="/" class="auth-close" aria-label="Cerrar acceso">×</a></div>
    <div class="auth-eyebrow"><span></span> ACCESO A COCHEMOTOR</div>
    <h1 id="auth-title">Entra y continúa donde lo dejaste</h1>
    <p class="auth-intro" id="auth-intro">Accede para publicar coches, guardar búsquedas o hablar con un vendedor.</p>
    <div class="auth-audience" role="group" aria-label="Qué quieres hacer">
      <button type="button" class="auth-audience-option" data-audience="buyer">Buscar un coche</button>
      <button type="button" class="auth-audience-option" data-audience="professional">Gestionar mis coches</button>
    </div>
    <div id="auth-status" class="auth-status" role="status" aria-live="polite"></div>
    <div class="auth-tabs" role="tablist" aria-label="Acceso a CocheMotor">
      <button type="button" class="auth-tab active" id="login-tab" role="tab" aria-selected="true" aria-controls="login-panel">Iniciar sesión</button>
      <button type="button" class="auth-tab" id="register-tab" role="tab" aria-selected="false" aria-controls="register-panel">Crear cuenta</button>
    </div>
    <section id="login-panel" role="tabpanel" aria-labelledby="login-tab">
    <form id="login-form">
      <label for="login-email">Correo electrónico</label><input id="login-email" type="email" autocomplete="email" required>
      <div class="auth-label-row"><label for="login-password">Contraseña</label><a href="mailto:hola@cochemotor.es?subject=Recuperar%20acceso">¿Has olvidado tu contraseña?</a></div><input id="login-password" type="password" autocomplete="current-password" minlength="10" required>
      <button class="btn btn-navy" type="submit">Continuar</button>
    </form>
    <p class="auth-switch">¿Aún no tienes cuenta? <button type="button" data-show-auth="register">Crear cuenta gratis</button></p>
    </section>
    <section id="register-panel" role="tabpanel" aria-labelledby="register-tab" hidden>
    <form id="register-form">
      <label for="register-name">Nombre o nombre comercial</label><input id="register-name" autocomplete="organization" required>
      <label for="register-email">Correo electrónico</label><input id="register-email" type="email" autocomplete="email" required>
      <label for="register-password">Contraseña</label><input id="register-password" type="password" autocomplete="new-password" minlength="10" required>
      <label class="auth-consent"><input id="register-privacy-read" type="checkbox" required> He leído la <a href="/privacidad" target="_blank" rel="noopener">Política de privacidad</a>.</label>
      <label class="auth-consent"><input id="register-terms-accepted" type="checkbox" required> Acepto los <a href="/terminos" target="_blank" rel="noopener">Términos del Servicio</a>.</label>
      <button class="btn btn-red" type="submit">Crear cuenta gratis</button>
    </form>
    <p class="auth-note">Empieza gratis durante la beta. Te explicaremos cualquier plan antes de activar un coste.</p>
    <p class="auth-switch">¿Ya tienes cuenta? <button type="button" data-show-auth="login">Iniciar sesión</button></p>
    </section>
  </main>
  <script src="api-config.js"></script><script>
    const status = document.getElementById('auth-status');
    const params = new URLSearchParams(location.search);
    const audience = params.get('audience') === 'professional' ? 'professional' : 'buyer';
    const allowedReturns = { hub:'/panel', marketplace:'/marketplace', demanda:'/demanda', publish:'/publicar' };
    const returnKey = params.get('return');
    const returnTo = allowedReturns[returnKey] || (location.hash.startsWith('#return=') ? location.hash.slice(8) : '/marketplace');
    const show = (message, kind='info') => { status.textContent = message; status.dataset.kind = kind; };
    function showAuth(mode) { const login = mode === 'login'; document.getElementById('login-panel').hidden = !login; document.getElementById('register-panel').hidden = login; document.querySelectorAll('.auth-tab').forEach(tab => { const active = tab.id === (login ? 'login-tab' : 'register-tab'); tab.classList.toggle('active', active); tab.setAttribute('aria-selected', String(active)); }); }
    function setAudience(next) { document.querySelectorAll('[data-audience]').forEach(button => button.classList.toggle('active', button.dataset.audience === next)); document.getElementById('auth-intro').textContent = next === 'professional' ? 'Accede para publicar coches, organizar tus contactos y seguir cada oportunidad.' : 'Accede para guardar búsquedas, pedir ayuda o hablar con un vendedor.'; }
    setAudience(audience);
    if (params.get('mode') === 'register' || params.get('mode') === 'login') showAuth(params.get('mode'));
    if (params.get('verified') === '1') { showAuth('login'); show('Correo verificado. Ya puedes iniciar sesión.', 'success'); }
    document.querySelectorAll('[data-audience]').forEach(button => button.addEventListener('click', () => setAudience(button.dataset.audience)));
    document.querySelectorAll('[data-show-auth]').forEach(button => button.addEventListener('click', () => showAuth(button.dataset.showAuth)));
    document.getElementById('login-tab').addEventListener('click', () => showAuth('login'));
    document.getElementById('register-tab').addEventListener('click', () => showAuth('register'));
    async function send(payload) { const response = await fetch((window.COCHEMOTOR_API_BASE || '') + '/api/auth', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}); const contentType = response.headers.get('content-type') || ''; const raw = await response.text(); let data; try { data = contentType.includes('application/json') ? JSON.parse(raw) : null; } catch (_) { data = null; } if (!response.ok) throw new Error(data?.error || (data ? 'No se pudo completar la operación' : 'El servicio de acceso no está disponible en este dominio.')); if (!data) throw new Error('El servicio de acceso no está disponible en este dominio.'); return data; }
    document.getElementById('register-form').addEventListener('submit', async event => { event.preventDefault(); const form=event.currentTarget; const submit=form.querySelector('button[type="submit"]'); submit.disabled=true; submit.textContent='Enviando…'; try { const d = await send({action:'register', name:document.getElementById('register-name').value, email:document.getElementById('register-email').value, password:document.getElementById('register-password').value, privacy_notice_read:document.getElementById('register-privacy-read').checked, privacy_notice_version:'privacy-v1', terms_accepted:document.getElementById('register-terms-accepted').checked, terms_version:'beta-terms-v1'}); show(d.message || 'Te enviamos un enlace para verificar tu correo. Revisa también la carpeta de correo no deseado.', 'success'); form.reset(); } catch (error) { show(error.message, 'error'); } finally { submit.disabled=false; submit.textContent='Crear cuenta gratis'; } });
    document.getElementById('login-form').addEventListener('submit', async event => { event.preventDefault(); try { const d = await send({action:'login', email:document.getElementById('login-email').value, password:document.getElementById('login-password').value}); if (!d.user.verified) { show('Revisa tu correo para verificar la cuenta antes de continuar.', 'error'); return; } const phone=d.user.phone||''; const professionalType=d.user.professional_type||''; localStorage.setItem('cochemotor_local_session', JSON.stringify({userId:d.user.user_id, email:d.user.email, name:d.user.name, phone, professionalType, profileComplete:Boolean(phone&&professionalType), verified:true, sessionToken:d.session_token, audience:document.querySelector('.auth-audience-option.active')?.dataset.audience || audience, createdAt:Date.now()})); window.location.href = returnTo; } catch (error) { show(error.message, 'error'); } });
  </script>
</body>
</html>
