<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso profesional — CocheMotor</title>
  <link rel="icon" href="assets/brand/favicons/favicon.ico?v=11.0" sizes="any"><link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-card" aria-labelledby="auth-title">
    <a href="index.html" class="auth-back">← Volver a CocheMotor</a>
    <h1 id="auth-title">Acceso profesional</h1>
    <p class="auth-intro">Entra en tu espacio para publicar coches, gestionar contactos y seguir cada oportunidad.</p>
    <div id="auth-status" class="auth-status" role="status" aria-live="polite"></div>
    <form id="login-form">
      <label for="login-email">Correo electrónico</label><input id="login-email" type="email" autocomplete="email" required>
      <label for="login-password">Contraseña</label><input id="login-password" type="password" autocomplete="current-password" minlength="10" required>
      <button class="btn btn-navy" type="submit">Entrar en mi espacio</button>
    </form>
    <hr>
    <h2>Crear una cuenta</h2>
    <form id="register-form">
      <label for="register-name">Nombre</label><input id="register-name" required>
      <label for="register-email">Correo electrónico</label><input id="register-email" type="email" autocomplete="email" required>
      <label for="register-password">Contraseña</label><input id="register-password" type="password" autocomplete="new-password" minlength="10" required>
      <button class="btn btn-red" type="submit">Crear cuenta beta</button>
    </form>
    <p class="auth-note">La beta es gratuita durante esta fase. Los planes definitivos se comunicarán más adelante.</p>
  </main>
  <script>
    const status = document.getElementById('auth-status');
    const show = (message, kind='info') => { status.textContent = message; status.dataset.kind = kind; };
    async function send(payload) { const response = await fetch('/api/auth', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}); const data = await response.json(); if (!response.ok) throw new Error(data.error || 'No se pudo completar la operación'); return data; }
    document.getElementById('register-form').addEventListener('submit', async event => { event.preventDefault(); try { const d = await send({action:'register', name:document.getElementById('register-name').value, email:document.getElementById('register-email').value, password:document.getElementById('register-password').value}); show(`Cuenta creada. Para esta demo local, abre el enlace de verificación: ${d.verification_url}`, 'success'); } catch (error) { show(error.message, 'error'); } });
    document.getElementById('login-form').addEventListener('submit', async event => { event.preventDefault(); try { const d = await send({action:'login', email:document.getElementById('login-email').value, password:document.getElementById('login-password').value}); if (!d.user.verified) { show('Debes verificar tu correo antes de entrar al espacio profesional.', 'error'); return; } localStorage.setItem('cochemotor_local_session', JSON.stringify({userId:d.user.user_id, email:d.user.email, name:d.user.name, createdAt:Date.now()})); window.location.href = 'hub.html'; } catch (error) { show(error.message, 'error'); } });
  </script>
</body>
</html>
