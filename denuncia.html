<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Informar de un anuncio — CocheMotor</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="assets/brand/favicons/favicon.ico"></head><body class="auth-page"><main class="auth-card"><a class="auth-back" href="index.html">← Volver a CocheMotor</a><h1>Informar de un anuncio</h1><p class="auth-intro">Ayúdanos a mantener anuncios claros y adecuados. Revisaremos la información y te escribiremos si necesitamos más datos.</p><form id="report-form"><label for="listing">Referencia o enlace del anuncio</label><input id="listing" required placeholder="Ej.: cm-001"><label for="reason">Motivo</label><select id="reason" required><option value="">Selecciona un motivo</option><option>Anuncio incorrecto o engañoso</option><option>Contenido no deseado</option><option>Problema con el contacto</option><option>Otro</option></select><label for="description">Qué ha ocurrido</label><textarea id="description" rows="5" required maxlength="2000"></textarea><label for="email">Correo para seguimiento (opcional)</label><input id="email" type="email" autocomplete="email"><label><input id="privacy" type="checkbox" required> Acepto que CocheMotor trate estos datos para gestionar la denuncia.</label><button class="btn btn-red" type="submit">Enviar denuncia</button><p id="status" class="auth-status" role="status" aria-live="polite"></p></form></main><script>const form=document.getElementById('report-form'),status=document.getElementById('status');form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Enviando…';try{const r=await fetch('/api/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({listing_reference:document.getElementById('listing').value.trim(),reason:document.getElementById('reason').value,description:document.getElementById('description').value.trim(),email:document.getElementById('email').value.trim(),privacy_consent:document.getElementById('privacy').checked})});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo enviar');form.reset();status.textContent='Denuncia registrada. Referencia: '+d.id;}catch(err){status.textContent=err.message;}});</script></body></html>
