<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leads | CocheMotor</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="assets/brand/favicons/favicon.ico"></head><body class="auth-page"><main class="auth-card" style="max-width:760px"><a class="auth-back" href="asesor.html">← Volver a solicitudes</a><h1>Contactos recibidos</h1><p class="auth-intro">Consulta los contactos asignados al tenant de tu sesión profesional.</p><button id="load" class="btn btn-navy" style="margin-top:12px">Cargar contactos</button><p id="status" class="auth-status" role="status"></p><div id="list"></div></main><script>const esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));const session=JSON.parse(localStorage.getItem('cochemotor_local_session')||'null');document.getElementById('load').onclick=async()=>{const status=document.getElementById('status'),list=document.getElementById('list');list.textContent='';try{if(!session?.sessionToken)throw Error('Debes iniciar sesión.');const r=await fetch('/api/leads',{headers:{Authorization:'Bearer '+session.sessionToken}}),d=await r.json();if(!r.ok)throw Error(d.error||'No autorizado');status.textContent=d.leads.length+' contacto(s)';d.leads.forEach(l=>{const card=document.createElement('article');card.style='border:1px solid #dbe3ee;border-radius:12px;padding:16px;margin:12px 0';card.innerHTML='<strong>'+esc(l.buyer_name)+'</strong><p>Vehículo: '+esc(l.vehicle_id)+' · Teléfono: '+esc(l.phone)+'</p><p>Pago previsto: '+esc(l.payment_method||'No indicado')+' · Puntuación: '+esc(l.score)+'</p>';list.append(card)})}catch(e){status.textContent=e.message}};</script></body></html>
