<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitudes | CocheMotor</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="assets/brand/favicons/favicon.ico"></head><body class="auth-page"><main class="auth-card" style="max-width:760px"><a class="auth-back" href="hub.html">← Volver al espacio profesional</a><h1>Solicitudes Coche Ideal</h1><p class="auth-intro">Panel interno para asesores autorizados.</p><button id="load" class="btn btn-navy">Cargar solicitudes</button><p id="status" class="auth-status" role="status"></p><div id="list"></div></main><script>const esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));const statuses=['nueva','en revisión','opciones encontradas','presentada al cliente','aceptada','descartada','cerrada'];const session=JSON.parse(localStorage.getItem('cochemotor_local_session')||'null');document.getElementById('load').onclick=async()=>{const status=document.getElementById('status'),list=document.getElementById('list');list.textContent='';try{if(!session?.sessionToken)throw Error('Debes iniciar sesión.');const headers={Authorization:'Bearer '+session.sessionToken};const r=await fetch('/api/coche-ideal',{headers}),d=await r.json();if(!r.ok)throw Error(d.error||'No autorizado');status.textContent=d.requests.length+' solicitud(es)';d.requests.forEach(x=>{const card=document.createElement('article');card.style='border:1px solid #dbe3ee;border-radius:12px;padding:16px;margin:12px 0';const v=x.vehicle||{},c=x.contact||{},p=x.preferences||{};card.innerHTML='<strong>'+esc(x.id)+'</strong> · '+esc(x.status)+'<h2>'+[v.brand,v.model,v.version].filter(Boolean).map(esc).join(' ')+'</h2><p>Presupuesto: '+(p.budgetMin||0)+'–'+(p.budgetMax||0)+' € · '+esc(p.fuel||'')+' · '+esc(p.gearbox||'')+'</p><p>Solicitante: '+esc(c.name||'')+' · '+esc(c.province||'')+'</p><label>Estado <select>'+statuses.map(s=>'<option>'+s+'</option>').join('')+'</select></label>';const select=card.querySelector('select');select.value=x.status;select.onchange=async()=>{const response=await fetch('/api/coche-ideal',{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({id:x.id,status:select.value})});if(!response.ok){select.value=x.status;status.textContent='No se pudo actualizar el estado.';}else{x.status=select.value;status.textContent='Estado actualizado.';}};list.append(card)})}catch(e){status.textContent=e.message}};</script></body></html>
