<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asesor | CocheMotor</title><link rel="stylesheet" href="styles.css"></head><body><main style="max-width:1100px;margin:40px auto;padding:24px"><h1>Solicitudes Coche Ideal</h1><p>Panel interno de seguimiento para asesores.</p><label>Clave de asesor <input id="key" type="password" autocomplete="off"></label> <button id="load" class="btn btn-navy">Cargar solicitudes</button><p id="status" role="status"></p><div id="list"></div></main><script>const esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));const statuses=['nueva','en revisión','opciones encontradas','presentada al cliente','aceptada','descartada','cerrada'];document.getElementById('load').onclick=async()=>{const status=document.getElementById('status');const list=document.getElementById('list');list.textContent='';try{const r=await fetch('/api/coche-ideal',{headers:{'X-Advisor-Key':document.getElementById('key').value}});const d=await r.json();if(!r.ok)throw Error(d.error||'No autorizado');status.textContent=d.requests.length+' solicitud(es)';d.requests.forEach(x=>{const card=document.createElement('article');card.style='border:1px solid #dbe3ee;border-radius:12px;padding:16px;margin:12px 0';const v=x.vehicle||{},c=x.contact||{},p=x.preferences||{};card.innerHTML='<strong>'+esc(x.id)+'</strong> · '+esc(x.status)+'<h2>'+[v.brand,v.model,v.version].filter(Boolean).join(' ')+'</h2><p>Presupuesto: '+(p.budgetMin||0)+'–'+(p.budgetMax||0)+' € · '+(p.fuel||'')+' · '+(p.gearbox||'')+'</p><p>Solicitante: '+esc(c.name||'')+' · '+esc(c.province||'')+'</p><label>Estado <select>'+statuses.map(s=>'<option>'+s+'</option>').join('')+'</select></label>';const select=card.querySelector('select');select.value=x.status;select.onchange=async()=>{const response=await fetch('/api/coche-ideal',{method:'PUT',headers:{'Content-Type':'application/json','X-Advisor-Key':document.getElementById('key').value},body:JSON.stringify({id:x.id,status:select.value})});if(!response.ok){select.value=x.status;status.textContent='No se pudo actualizar el estado.';}else{x.status=select.value;status.textContent='Estado actualizado.';}};list.append(card)})}catch(e){status.textContent=e.message}};</script></body></html>
